[project]
name = "smart-light"
version = "0.1.0"
requires-python = ">=3.10"
license = "MIT"
description = "Multimodale, lokale KI-Emotionserkennung via Webcam + Mikrofon + Koerpersprache → steuert Hue-Lampenfarbe in Echtzeit."

dependencies = [
    "opencv-python>=4.8.0",
    "deepface>=0.0.93",
    "phue>=1.1",
    "tensorflow>=2.15.0",
    "tf-keras>=2.15.0",
    "numpy>=1.24.0",
    "retina-face>=0.0.17",
    "sounddevice>=0.4.6",
    "speechbrain>=1.0.0",
    "torch>=2.0.0",
    "mediapipe>=0.10.0",
    "transformers>=4.30,<5.0",
    "scipy>=1.10.0",
    "psutil>=5.9.0",
    "pynput>=1.7.0",
    "alexapy>=1.28.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = [".", "core", "analyzers", "benchmarks", "tests", "training"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long — handled by formatter
    "SIM108", # ternary can reduce readability
]

[tool.ruff.lint.isort]
known-first-party = ["core", "analyzers", "config"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
